name: Cloudflare Serverless Deployment via Terraform IaC

# Trigger workflow on pushes to main branch affecting application or terraform code,
# or manually via the GitHub Actions UI (workflow_dispatch)
on:
  push:
    branches:
      - main
    paths:
      - 'application/**'
      - 'terraform/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Principle of least privilege: runner only requires read access to repository contents
permissions:
  contents: read

jobs:
  terraform-ci-cd:
    name: Terraform Lint, Validate, Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    env:
      # Inject Cloudflare credentials from GitHub Secrets
      # Mapped to both standard provider env vars and Terraform TF_VAR input variables
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Step 1 - Check Canonical Code Formatting (terraform fmt)
        run: terraform fmt -check

      - name: Step 2 - Initialize Terraform Provider & Modules (terraform init)
        run: terraform init

      - name: Step 3 - Validate Configuration Syntax & Resource Arguments (terraform validate)
        run: terraform validate

      - name: Step 4 - Generate Speculative Execution Plan (terraform plan)
        run: terraform plan -input=false -out=tfplan

      - name: Step 5 - Apply & Deploy Infrastructure to Cloudflare (terraform apply)
        if: github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
